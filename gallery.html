<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Our Gallery — Brew Haven Coffee Shop</title>
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="gallery.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&family=Dancing+Script:wght@600;700&display=swap" rel="stylesheet">
</head>
<body>

<!-- ===== HEADER ===== -->
<header class="site-header">
  <div class="header-inner">
    <a class="logo" href="index.html">
      <span class="logo-icon">☕</span>
      <span class="logo-text">
        <span class="logo-script">Brew Haven</span>
        <span class="logo-sub">COFFEE SHOP</span>
      </span>
    </a>

    <nav class="main-nav">
      <a href="index.html">Home</a>
      <a href="about.html">About</a>
      <a href="menu.html">Menu</a>
      <a href="gallery.html" class="active">Gallery</a>
      <a href="contact.html">Contact</a>
    </nav>

    <a href="contact.html#send-message" class="btn btn-filled">ORDER NOW</a>
  </div>
</header>

<!-- ===== GALLERY HERO ===== -->
<section class="gallery-hero">
  <div class="gallery-hero-overlay"></div>
  <div class="gallery-hero-text">
    <h1>Our Gallery <span class="camera-icon">📷</span></h1>
    <p>Moments, Coffee, and Happiness.</p>
  </div>
</section>

<!-- ===== GALLERY GRID ===== -->
<section class="gallery-grid-section">
  <div class="gallery-grid">
    <div class="gallery-item">
      <img src="images/cafe-interior.jpg" alt="Cozy coffee shop interior with warm lighting">
    </div>
    <div class="gallery-item">
      <img src="images/latte-heart.jpg" alt="Latte with heart-shaped foam art">
    </div>
    <div class="gallery-item">
      <img src="images/cappuccino.jpg" alt="Cappuccino with cocoa powder design">
    </div>
    <div class="gallery-item">
      <img src="images/mocha.jpg" alt="Mocha topped with whipped cream and chocolate drizzle">
    </div>
    <div class="gallery-item">
      <img src="images/espresso.jpg" alt="Espresso shot surrounded by coffee beans">
    </div>
    <div class="gallery-item">
      <img src="images/matcha-latte.jpeg" alt="Matcha latte with foam art in a white cup">
    </div>
    <div class="gallery-item">
      <img src="images/iced-coffee.jpeg" alt="Iced coffee in a glass with coffee beans">
    </div>
    <div class="gallery-item">
      <img src="images/croissants.jpg" alt="Fresh baked croissants and pastries on a plate">
    </div>
  </div>
</section>

<!-- ===== VIDEO & AUDIO ===== -->
<section class="media-section">
  <h2>WATCH &amp; LISTEN</h2>
  <div class="media-grid">
    <div class="media-card">
      <p class="media-label">In The Shop</p>
      <video controls preload="metadata">
        <source src="Steering.mp4" type="video/mp4">
        Your browser does not support the video tag.
      </video>
    </div>
    <div class="media-card">
      <p class="media-label">Our Theme</p>
      <audio controls preload="metadata">
        <source src="Theme.mp3" type="audio/mpeg">
        Your browser does not support the audio tag.
      </audio>
    </div>
  </div>
</section>

<!-- ===== FOOTER ===== -->
<footer class="site-footer">
  <a class="logo" href="index.html">
    <span class="logo-icon">☕</span>
    <span class="logo-text">
      <span class="logo-script">Brew Haven</span>
      <span class="logo-sub">COFFEE SHOP</span>
    </span>
  </a>
  <p class="footer-copyright">© 2026 Brew Haven Coffee Shop. All Rights Reserved.</p>
  <div class="footer-social">
    <a href="#" aria-label="Facebook">f</a>
    <a href="#" aria-label="Instagram">ig</a>
    <a href="#" aria-label="Twitter">tw</a>
  </div>
</footer>

</body>
</html>
